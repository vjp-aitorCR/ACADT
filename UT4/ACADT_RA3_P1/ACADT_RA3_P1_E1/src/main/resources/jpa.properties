# =====================================================================
#  Configuraci\u00c3\u00b3n de la herramienta ORM \u00c2\u00b7 ACADT \u00c2\u00b7 RA3 \u00c2\u00b7 CE b
#  La lee JPAUtil al crear la unidad de persistencia.
# =====================================================================

# --- Conexi\u00c3\u00b3n: copiad URL, usuario y contrase\u00c3\u00b1a de vuestro proyecto del RA2.
#     createDatabaseIfNotExist crea la BD "hibernate" si no existe.
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3306/ra3_p1_e1?createDatabaseIfNotExist=true
jakarta.persistence.jdbc.user=root
jakarta.persistence.jdbc.password=

jakarta.persistence.schema-generation.database.action=drop-and-create

hibernate.show_sql=true
hibernate.format_sql=true

# --- Generaci\u00c3\u00b3n del esquema
#     drop-and-create -> borra y crea las tablas en cada ejecuci\u00c3\u00b3n (desarrollo)
#     create          -> solo crea
#     none            -> no toca el esquema (producci\u00c3\u00b3n)
#     Equivalente nativo de Hibernate: hibernate.hbm2ddl.auto
jakarta.persistence.schema-generation.database.action=drop-and-create

# --- Mostrar el SQL que genera Hibernate (muy \u00c3\u00batil para aprender)
hibernate.show_sql=true
hibernate.format_sql=true

# No hace falta indicar el dialecto: Hibernate lo detecta a partir de la conexi\u00c3\u00b3n.
